; Queue worker memory ceiling.
; ProcessGeoFlowTaskJob does Connection::fetchAll() on large article result sets and
; OOMs at PHP's 128M default, which crash-loops the worker and fails every task
; ("attempted too many times"). Host has ample free memory and the worker is otherwise
; idle (~32MB), so 512M is safe. Mounted into the image's php conf.d via docker-compose.

memory_limit = 512M
