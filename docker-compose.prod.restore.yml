# 生产环境恢复配置 - PHP 8.4 + 旧数据库
name: geoflow-prod-restore

services:
  # 使用已有的旧 postgres，不启动新实例
  postgres:
    image: ignore

  # 队列用 database 驱动，不需要 redis

  app:
    image: geoflow-app:latest
    container_name: geo-system-web
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "router.php"]
    ports:
      - "18080:8080"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  queue:
    image: geoflow-app:latest
    container_name: geo-system-queue
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "queue:work", "database", "--queue=geoflow,distribution,default", "--sleep=1", "--tries=3", "--timeout=300"]
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  scheduler:
    image: geoflow-app:latest
    container_name: geo-system-scheduler
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
    restart: unless-stopped
